---
name: github-release
run-name: Perform release from latest tag

permissions:
  contents: write

on:
  push:
    tags: ["*"]

jobs:
  release:
    name: Create a GitHub release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: >-
          git config user.name github-actions;
          git config user.email github-actions@github.com;
          git config --global user.email github-actions@github.com;
          git config --global user.name github-actions;

      - name: Fetch latest tag
        id: tag
        run: |
          tag="$(git describe --tags "$(git rev-list --tags --max-count=1)")"
          echo "LATEST_TAG=$tag" >> "$GITHUB_ENV"
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: SemVer release
        uses: cocogitto/cocogitto-action@v3.5
        id: relase

      - name: Generate changelog
        run: >-
          cog changelog --at ${{env.LATEST_TAG }} --template
          remote > GITHUB_CHANGELOG.md

      - name: print
        run: echo ${{ env.LATEST_TAG }}

      - name: Upload github release
        uses: softprops/action-gh-release@v2
        with:
          body_path: GITHUB_CHANGELOG.md
          tag_name: ${{ env.LATEST_TAG }}

  upload-luarocks:
    name: Upload rocks to LuaRocks
    needs: release
    uses: ./.github/workflows/upload_luarocks.yaml
    with:
      rockspecs: >-
        ["chrono-scm-1.rockspec",
         "chrono-clock-scm-1.rockspec",
         "rockspecs/chrono-${{ needs.release.outputs.version }}-1.rockspec",
         "rockspecs/chrono-clock-${{ needs.release.outputs.version }}-1.rockspec"]
    secrets:
      apikey: ${{ secrets.LUAROCKS_API_KEY }}
