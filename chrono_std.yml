---
base: lua51

globals:
  jit:
    any: true

  package.config:
    any: true

  package.searchpath:
    args:
      - type: string
      - type: string
    must_use: true

  io.stderr.write:
    method: true
    args:
      - type: "..."
        required: false

  io.stderr.flush:
    method: true
    args: []

  io.stderr.close:
    method: true
    args: []

  load:
    args:
      - type: any
      - type: any
        required: false
      - type: any
        required: false
      - type: any
        required: false
